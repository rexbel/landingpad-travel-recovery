name: Provider credential preflight

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      provider:
        description: "Which provider(s) to check live"
        required: true
        type: choice
        default: all
        options:
          - all
          - aeroxplorer

permissions:
  contents: read

# push/pull_request runs have no `provider` input, so both jobs are eligible
# on every such run — the manual workflow_dispatch selection only applies to
# workflow_dispatch itself. Every job additionally requires same-repo origin
# on pull_request: a PR opened from a fork must never get access to these
# secrets, so pull_request_target is deliberately not used and this check
# stays in every job's `if`, not just the workflow trigger list.
concurrency:
  group: ${{ (github.event_name != 'workflow_dispatch' || github.event.inputs.provider == 'aeroxplorer') && 'aeroxplorer-preflight-token' || format('provider-preflight-{0}', github.run_id) }}
  cancel-in-progress: false

jobs:
  verify-provider-credentials:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: |
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) &&
      (github.event_name != 'workflow_dispatch' || github.event.inputs.provider == 'all')
    env:
      STAY22_API_KEY: ${{ secrets.STAY22_API_KEY }}
      ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
      ELEVENLABS_AGENT_ID: ${{ secrets.ELEVENLABS_AGENT_ID }}
      TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - name: Verify required secrets exist
        shell: bash
        run: |
          missing=0
          for name in STAY22_API_KEY ELEVENLABS_API_KEY ELEVENLABS_AGENT_ID TAVILY_API_KEY OPENAI_API_KEY; do
            if [[ -z "${!name}" ]]; then
              echo "::error::$name is not configured"
              missing=1
            fi
          done
          exit "$missing"

      - name: Verify Stay22
        shell: bash
        run: |
          checkin="$(date -u -d '+1 day' +%F)"
          checkout="$(date -u -d '+2 days' +%F)"
          status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            --max-time 15 \
            --header "X-API-KEY: $STAY22_API_KEY" \
            --get 'https://api.stay22.com/v2/accommodations' \
            --data-urlencode 'address=John F. Kennedy International Airport' \
            --data-urlencode "checkin=$checkin" \
            --data-urlencode "checkout=$checkout" \
            --data-urlencode 'adults=2' \
            --data-urlencode 'rooms=1' \
            --data-urlencode 'pageSize=1')"
          echo "Stay22: HTTP $status"
          [[ "$status" == "200" ]]

      - name: Verify ElevenLabs private agent session
        shell: bash
        run: |
          status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            --max-time 15 \
            --header "xi-api-key: $ELEVENLABS_API_KEY" \
            --get 'https://api.elevenlabs.io/v1/convai/conversation/get-signed-url' \
            --data-urlencode "agent_id=$ELEVENLABS_AGENT_ID")"
          echo "ElevenLabs: HTTP $status"
          [[ "$status" == "200" ]]

      - name: Verify Tavily
        shell: bash
        run: |
          payload="$(jq -cn --arg key "$TAVILY_API_KEY" \
            '{api_key:$key,query:"JFK Airport official website",max_results:1}')"
          status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            --max-time 15 \
            --request POST 'https://api.tavily.com/search' \
            --header 'Content-Type: application/json' \
            --data "$payload")"
          echo "Tavily: HTTP $status"
          [[ "$status" == "200" ]]

      - name: Verify OpenAI
        shell: bash
        run: |
          status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            --max-time 15 \
            --header "Authorization: Bearer $OPENAI_API_KEY" \
            'https://api.openai.com/v1/models')"
          echo "OpenAI: HTTP $status"
          [[ "$status" == "200" ]]

  verify-aeroxplorer:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    if: |
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) &&
      (github.event_name != 'workflow_dispatch' || github.event.inputs.provider == 'aeroxplorer')
    permissions:
      contents: read
    env:
      AEROXPLORER_API_KEY: ${{ secrets.AEROXPLORER_API_KEY }}
      AEROXPLORER_API_SECRET: ${{ secrets.AEROXPLORER_API_SECRET }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify AeroXplorer (token + JFK airport lookup)
        run: npm run preflight:live:aeroxplorer
